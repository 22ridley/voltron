[package]
name = "voltron"
version = "0.1.0"
edition = "2018"
build = "build.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
sesame = { path = "../../../sesame/core", default_features = false, features = ["derive"] }
sesame_mysql = { path = "../../../sesame/mysql", default_features = false, features = ["derive"] }
sesame_rocket = { path = "../../../sesame/rocket", default_features = false, features = ["derive", "mysql"] }
bitvec = "0.22.3"
rocket = { git = "https://github.com/KinanBab/Rocket.git", branch = "main" }
chrono = "0.4.31"
mysql = "21.0.2"
rocket_cors = { git = "https://github.com/KinanBab/rocket_cors.git", branch = "main" }
rocket_firebase_auth = { git = "https://github.com/22ridley/rocket-firebase-auth.git" }
serde = "1.0.195"
toml = "0.2.1"
slog = { version = "2.4.0", features = ["max_level_trace", "release_max_level_trace"] }
slog-term = "2.4.0"
once_cell = "1.19.0"
serde_json = "1.0.116"
wiremock = "0.6.0"
tokio = "1.37.0"

[dependencies.rocket_dyn_templates]
git = "https://github.com/KinanBab/Rocket.git"
branch = "main"
features = ["handlebars", "tera"]

[dependencies.handlebars]
features = ["dir_source"]

[build-dependencies]
sesame_build = { path = "../../../sesame/build" }

